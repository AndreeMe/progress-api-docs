<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress NW Catalog API — Documentation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #redoc-container {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="redoc-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/redoc@2.2.0/bundles/redoc.standalone.js"></script>
  <script>
    fetch('swagger.json')
      .then(function(res) {
        if (!res.ok) {
          throw new Error('Failed to load swagger.json: ' + res.status);
        }
        return res.json();
      })
      .then(function(spec) {
        Redoc.init(spec, {
          scrollYOffset: 0,
          hideHostname: false,
          expandResponses: '200',
          requiredPropsFirst: true,
          sortPropsAlphabetically: false,
          hideDownloadButton: false,
          disableSearch: false,
          theme: {
            colors: {
              primary: {
                main: '#2e7d32'
              }
            }
          }
        }, document.getElementById('redoc-container'));
      })
      .catch(function(err) {
        document.getElementById('redoc-container').innerHTML =
          '<div style="padding:40px;text-align:center;font-family:sans-serif;">' +
          '<h2>Ошибка загрузки документации</h2>' +
          '<p>Не удалось загрузить swagger.json: ' + err.message + '</p>' +
          '<p>Убедитесь, что файл swagger.json находится в той же директории, что и index.html</p>' +
          '</div>';
      });
  </script>
</body>
</html>
