<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Progress NW Catalog API</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f8fafc; }
    .msg { padding: 1rem; margin: 1rem 0; border-radius: 6px; border-left: 4px solid #64748b; background: white; }
    .msg.error { border-left-color: #dc2626; background: #fef2f2; }
    .msg.ok { border-left-color: #16a34a; background: #f0fdf4; }
    .hidden { display: none; }
    #redoc-container { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>📦 Progress NW Catalog API</h1>
  <div id="status"></div>
  <div id="redoc-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js"></script>
  <script>
    const status = document.getElementById('status');
    const log = (msg, type = 'info') => {
      console.log(`[LOG] ${msg}`);
      const el = document.createElement('div');
      el.className = `msg ${type}`;
      el.textContent = msg;
      status.appendChild(el);
    };

    // Загружаем swagger.json и инициализируем Redoc
    fetch('swagger.json')
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then(spec => {
        log('✅ swagger.json загружен', 'ok');
        log('🚀 Инициализация Redoc...', 'info');
        return Redoc.init(spec, {
          theme: {
            typography: { fontSize: '14px', lineHeight: '1.5' },
            colors: { primary: { main: '#2563eb' } }
          },
          hideHostname: false
        }, document.getElementById('redoc-container'));
      })
      .then(() => {
        log('✅ Документация отображена', 'ok');
      })
      .catch(err => {
        log(`❌ Ошибка: ${err.message}`, 'error');
        console.error(err);
      });
  </script>
</body>
</html>
