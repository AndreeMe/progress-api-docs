<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Progress NW Catalog API</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f8fafc; }
    .msg { padding: 1rem; margin: 1rem 0; border-radius: 6px; border-left: 4px solid #64748b; background: white; }
    .msg.error { border-left-color: #dc2626; background: #fef2f2; }
    .msg.ok { border-left-color: #16a34a; background: #f0fdf4; }
    #redoc-container { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>📦 Progress NW Catalog API</h1>
  <div id="status"></div>
  <div id="redoc-container"></div>

  <script>
    const status = document.getElementById('status');
    const log = (msg, type = 'info') => {
      console.log(`[LOG] ${msg}`);
      const el = document.createElement('div');
      el.className = `msg ${type}`;
      el.innerHTML = msg;
      status.appendChild(el);
    };

    // 1. Проверяем доступность swagger.yaml
    fetch('swagger.yaml')
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then(yaml => {
        log(`✅ swagger.yaml загружен (${yaml.length} байт)`, 'ok');
        loadRedoc();
      })
      .catch(err => {
        log(`❌ Не удалось загрузить swagger.yaml: ${err.message}`, 'error');
        log(`💡 Попробуй открыть напрямую: <a href="swagger.yaml" target="_blank">swagger.yaml</a>`, 'info');
      });

    function loadRedoc() {
      if (window.Redoc) {
        initRedoc();
        return;
      }

      const cdns = [
        'https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js',
        'https://unpkg.com/redoc@latest/bundles/redoc.standalone.js',
        'https://cdnjs.cloudflare.com/ajax/libs/redoc/2.1.5/bundles/redoc.standalone.js'
      ];

      let idx = 0;
      const tryLoad = () => {
        if (idx >= cdns.length) {
          log('❌ Не удалось загрузить Redoc ни с одного CDN', 'error');
          return;
        }
        const src = cdns[idx++];
        log(`⏳ Загрузка Redoc с ${src}...`);
        
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => {
          log(`✅ Redoc загружен`, 'ok');
          initRedoc();
        };
        script.onerror = () => {
          log(`⚠️ Ошибка с ${src}, пробуем следующий...`, 'info');
          tryLoad();
        };
        document.head.appendChild(script);
      };
      tryLoad();
    }

    function initRedoc() {
      try {
        log('🚀 Инициализация Redoc...');
        
        // ⚠️ Redoc.init() НЕ возвращает Promise в большинстве версий!
        // Вызываем синхронно + try-catch для отлова ошибок
        Redoc.init(
          'swagger.yaml',
          {
            theme: {
              typography: { fontSize: '14px', lineHeight: '1.5' },
              colors: { primary: { main: '#2563eb' } }
            },
            hideHostname: false,
            expandSingleSchemaField: true,
            nativeScrollbars: true
          },
          document.getElementById('redoc-container')
        );
        
        // Если дошли сюда — инициализация прошла без исключений
        setTimeout(() => {
          if (document.getElementById('redoc-container').querySelector('.redoc-wrapper')) {
            log('✅ Документация отображена', 'ok');
          }
        }, 500); // Небольшая задержка, чтобы редеринг успел завершиться
        
      } catch (e) {
        log(`❌ Ошибка инициализации: ${e.message || e}`, 'error');
        log(`💡 Проверь валидность swagger.yaml в <a href="https://validator.swagger.io" target="_blank">валидаторе</a>`, 'info');
      }
    }
  </script>
</body>
</html>
