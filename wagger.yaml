openapi: 3.0.3
info:
  title: Progress NW Catalog API
  description: API для получения данных о товарах из каталога progress-nw.ru
  version: 1.0.0
  contact:
    email: api@progress-nw.ru
servers:
  - url: https://progress-nw.ru/api/v1
    description: Production

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  
  schemas:
    ProductStatus:
      type: string
      enum: [active, archived]
      description: |
        active — товар доступен, 
        archived — снят с продажи
    
    ProductListItem:
      type: object
      properties:
        id: { type: string, example: "node1-classic-001" }
        name: { type: string, example: "Node1 Classic" }
        category: { type: string, example: "ventilation-units" }
        subcategory: { type: string, example: "plate-heat-exchanger" }
        status: { $ref: '#/components/schemas/ProductStatus' }
        updated_at: { type: string, format: date-time, example: "2026-03-15T10:30:00+03:00" }
        created_at: { type: string, format: date-time }
        url: { type: string, example: "/catalog/ventilation-units/node1-classic" }
      required: [id, name, status, updated_at]
    
    ProductDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            path: { type: array, items: { type: string } }
        specifications:
          type: object
          additionalProperties:
            type: object
            properties:
              value: { oneOf: [{type: number}, {type: string}] }
              unit: { type: string }
        media:
          type: object
          properties:
            images:
              type: array
              items:
                type: object
                properties:
                  url: { type: string, format: uri }
                  alt: { type: string }
                  order: { type: integer }
            documents:
              type: array
              items:
                type: object
                properties:
                  url: { type: string, format: uri }
                  type: { type: string }
                  name: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        seo:
          type: object
          properties:
            title: { type: string }
            meta_description: { type: string }
        updated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, name, status, updated_at]
    
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: "PRODUCT_NOT_FOUND" }
            message: { type: string, example: "Товар не найден" }

paths:
  /products:
    get:
      summary: Список товаров
      tags: [Products]
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Фильтр по категории (slug)
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
          description: Фильтр по статусу
        - name: updated_from
          in: query
          schema: { type: string, format: date-time }
          description: Показать товары, обновлённые после даты
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      pages: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductListItem' }
              example:
                meta: { total: 1250, page: 1, limit: 50, pages: 25 }
                data:
                  - id: "node1-classic-001"
                    name: "Node1 Classic"
                    category: "ventilation-units"
                    status: "active"
                    updated_at: "2026-03-15T10:30:00+03:00"
                    url: "/catalog/ventilation-units/node1-classic"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /products/{product_id}:
    get:
      summary: Детали товара
      tags: [Products]
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: string }
          description: ID товара (slug или UUID)
      responses:
        '200':
          description: Детали товара
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404':
          description: Товар не найден
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: "PRODUCT_NOT_FOUND"
                  message: "Товар с указанным идентификатором не найден"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /categories:
    get:
      summary: Список категорий (опционально)
      tags: [Categories]
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    slug: { type: string }
                    parent_id: { type: string, nullable: true }

  components/responses:
    Unauthorized:
      description: Неверный или отсутствующий API-Key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: "UNAUTHORIZED", message: "Invalid API key" }
    RateLimited:
      description: Превышен лимит запросов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: "RATE_LIMITED", message: "Too many requests" }

tags:
  - name: Products
    description: Работа с товарами
  - name: Categories
    description: Справочник категорий